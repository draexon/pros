<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Pros - 210 original React components. A monochrome design system with movement, character, and purpose. By draexon."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pros - Interfaces with feeling.</title>
    <script>
      try {
        const t = localStorage.getItem("pros.theme");
        document.documentElement.dataset.theme =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
